<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week Roller</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0e0f0e;
  --fg:#c8c5bc;
  --dim:#5d5c55;
  --line:#23241f;
  --hot:#d6883c;
  --cool:#7e9f6e;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font:14px/1.5 var(--mono);
  padding:28px 16px 64px;
  max-width:720px;
  margin:0 auto;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--dim)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lbl{color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:lowercase}
.meta{color:var(--dim);font-size:12px;white-space:nowrap}

header{margin-bottom:22px}
header .t{letter-spacing:.02em}
header .s{color:var(--dim);font-size:12px;margin-top:2px}

.slot{margin:14px 0 4px}
.word{
  font-size:clamp(26px,7.5vw,42px);
  line-height:1.12;
  margin:2px 0 0;
  letter-spacing:-.01em;
  cursor:pointer;
  word-break:break-word;
}
.word.core{color:var(--hot)}
.word.theme{color:var(--cool)}
.word.none{color:var(--line)}
.word.scramble{color:var(--dim)}
.word:active{opacity:.6}

#core2{display:none}
#core2.on{display:block}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px}
button{
  font:inherit;
  color:var(--fg);
  background:transparent;
  border:1px solid var(--line);
  padding:7px 12px;
  cursor:pointer;
}
button:hover{border-color:var(--dim)}
button:focus-visible{outline:1px solid var(--hot);outline-offset:1px}
button[aria-pressed="true"]{color:var(--bg);background:var(--fg);border-color:var(--fg)}
#roll{border-color:var(--dim);min-width:104px}
.stepper{display:flex;border:1px solid var(--line)}
.stepper button{border:0;padding:7px 10px}
.stepper span{padding:7px 2px;color:var(--dim);min-width:66px;text-align:center}

#log{margin-top:26px}
#log ol{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
#log li{color:var(--dim);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log li b{font-weight:normal;color:var(--fg)}
footer{margin-top:34px;color:var(--dim);font-size:12px}
@media (max-width:420px){ .meta{font-size:11px} }
</style>
</head>
<body>

<header>
  <div class="t">week roller</div>
  <div class="s">one game a week. no arguing with the dice.</div>
</header>

<hr>

<section class="slot">
  <div class="row"><span class="lbl">core</span><span class="meta" id="coreMeta"></span></div>
  <div class="word core" id="core" title="click to copy">&mdash;</div>
  <div class="word core" id="core2" title="click to copy">&mdash;</div>
</section>

<hr>

<section class="slot">
  <div class="row"><span class="lbl">flavor</span><span class="meta" id="themeMeta"></span></div>
  <div class="word none" id="theme" title="click to copy">&mdash;</div>
</section>

<hr>

<div class="controls">
  <button id="roll">roll</button>
  <div class="stepper" title="chance the flavor list fires">
    <button id="minus" aria-label="lower chance">&minus;</button>
    <span id="pct">40%</span>
    <button id="plus" aria-label="raise chance">+</button>
  </div>
  <button id="two" aria-pressed="false">2 core</button>
  <button id="norepeat" aria-pressed="true">no repeats</button>
</div>

<section id="log">
  <div class="row"><span class="lbl">log</span><span class="meta"><a href="#" id="clear">clear</a></span></div>
  <ol id="logList"></ol>
</section>

<footer>space / enter = roll &middot; click a word to copy</footer>

<script>
const CORE = ["Simulator","Tycoon","Obby","Tower","Battlegrounds","RNG","Brainrot","Anime","Pets","Rebirth","Clicker","Incremental","AFK","Grinding","Gacha","Trading","Limited","Mutation","Traits","Rarity","Luck","Roll","Hatch","Crafting","Farming","Fishing","Mining","Digging","Steal","Collect","Build","Grow","Upgrade","Merge","Defend","Survive","Escape","Kill","Fight","Race","Climb","Parkour","Horror","Story","RP","Hangout","VC","Sandbox","Open World","Dungeon","Bosses","Raids","Waves","Quests","Loot","Skills","Classes","Abilities","Powers","Magic","Guns","Melee","Movement","Roguelike"];
const THEME = ["Backrooms","Analog Horror","Mascot Horror","Cute Horror","Cozy","Nostalgia","Retro","Y2K","2000s","90s","80s","Low-Poly","PS1","VHS","Found Footage","SCP","Paranormal","Zombie","Apocalypse","Medieval","Fantasy","Cyberpunk","Steampunk","Sci-Fi","Military","Western","Pirate","Mafia","Criminal","Police","Prison","School","Office","Retail","Restaurant","Farming","Fishing","Space","Ocean","Island"];

const $ = id => document.getElementById(id);
const el = {
  core:$("core"), core2:$("core2"), theme:$("theme"),
  coreMeta:$("coreMeta"), themeMeta:$("themeMeta"),
  pct:$("pct"), roll:$("roll"), two:$("two"), norepeat:$("norepeat"),
  logList:$("logList")
};

const store = {
  get(k, d){ try { const v = localStorage.getItem("wr."+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("wr."+k, JSON.stringify(v)); } catch(e){} }
};

let chance   = store.get("chance", 40);
let twoCore  = store.get("two", false);
let noRepeat = store.get("norepeat", true);
let log      = store.get("log", []);

// bags: shuffled queues so you don't get Obby four weeks running
const bags = { core:[], theme:[] };
function draw(list, name, exclude){
  if(!noRepeat) {
    let w; do { w = list[(Math.random()*list.length)|0]; } while(exclude && list.length > 1 && w === exclude);
    return w;
  }
  let bag = bags[name];
  if(!bag.length){
    bag = list.slice();
    for(let i=bag.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [bag[i],bag[j]]=[bag[j],bag[i]]; }
    bags[name] = bag;
  }
  let i = bag.length - 1;
  if(exclude && bag[i] === exclude && bag.length > 1) i--;
  return bag.splice(i,1)[0];
}
function bagLeft(name, list){ return noRepeat ? (bags[name].length || list.length) : list.length; }

function setWord(node, text, cls){
  node.textContent = text;
  node.className = "word " + cls;
}

let spinning = false;
function roll(){
  if(spinning) return;
  spinning = true;
  el.roll.textContent = "...";

  const hit = Math.random()*100 < chance;
  const a = draw(CORE, "core");
  const b = twoCore ? draw(CORE, "core", a) : null;
  const t = hit ? draw(THEME, "theme") : null;

  const ticks = 9;
  let n = 0;
  const spin = setInterval(() => {
    setWord(el.core, CORE[(Math.random()*CORE.length)|0], "core scramble");
    if(twoCore) setWord(el.core2, CORE[(Math.random()*CORE.length)|0], "core scramble");
    if(hit) setWord(el.theme, THEME[(Math.random()*THEME.length)|0], "theme scramble");
    if(++n >= ticks){
      clearInterval(spin);
      land(a, b, t, hit);
    }
  }, 38);
}

function land(a, b, t, hit){
  setWord(el.core, a, "core");
  if(b) setWord(el.core2, b, "core");
  setWord(el.theme, hit ? t : "no flavor", hit ? "theme" : "none");
  el.coreMeta.textContent  = noRepeat ? bagLeft("core", CORE) + " left in bag" : "";
  el.themeMeta.textContent = hit ? "hit at " + chance + "%" : "missed at " + chance + "%";
  el.roll.textContent = "roll";
  spinning = false;

  const parts = b ? [a, b] : [a];
  if(hit) parts.push(t);
  const d = new Date();
  log.unshift({
    t: d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"),
    w: parts.join(" + ")
  });
  log = log.slice(0, 12);
  store.set("log", log);
  renderLog();
}

function renderLog(){
  el.logList.innerHTML = "";
  for(const e of log){
    const li = document.createElement("li");
    const b = document.createElement("b");
    b.textContent = e.w;
    li.append(e.t + "  ", b);
    el.logList.append(li);
  }
}

function copy(node){
  const txt = node.textContent;
  if(!txt || txt === "—" || txt === "no flavor") return;
  const done = () => {
    const old = node.textContent;
    node.textContent = "copied";
    setTimeout(() => { if(node.textContent === "copied") node.textContent = old; }, 600);
  };
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done, ()=>{});
  else done();
}

function setChance(v){
  chance = Math.max(0, Math.min(100, v));
  el.pct.textContent = chance + "%";
  store.set("chance", chance);
}
function setTwo(v){
  twoCore = v;
  el.two.setAttribute("aria-pressed", String(v));
  el.core2.classList.toggle("on", v);
  if(!v) setWord(el.core2, "—", "core");
  store.set("two", v);
}
function setNoRepeat(v){
  noRepeat = v;
  el.norepeat.setAttribute("aria-pressed", String(v));
  bags.core = []; bags.theme = [];
  el.coreMeta.textContent = v ? CORE.length + " left in bag" : "";
  store.set("norepeat", v);
}

el.roll.onclick = roll;
$("minus").onclick = () => setChance(chance - 5);
$("plus").onclick  = () => setChance(chance + 5);
el.two.onclick = () => setTwo(!twoCore);
el.norepeat.onclick = () => setNoRepeat(!noRepeat);
$("clear").onclick = e => { e.preventDefault(); log = []; store.set("log", log); renderLog(); };
el.core.onclick = () => copy(el.core);
el.core2.onclick = () => copy(el.core2);
el.theme.onclick = () => copy(el.theme);
addEventListener("keydown", e => {
  if(e.target.tagName === "BUTTON" || e.target.tagName === "A") return;
  if(e.code === "Space" || e.code === "Enter"){ e.preventDefault(); roll(); }
});

setChance(chance);
setTwo(twoCore);
setNoRepeat(noRepeat);
renderLog();
</script>
</body>
</html>
